<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo 学习助手</title><style>body{width:300px;margin:0;padding:16px;font:14px/1.6 system-ui;color:#202533}h2{font-size:17px;margin:0 0 8px}p{color:#556070}</style><h2>Echo 学习助手</h2><p>当前版本改为通过 ChatGPT 网页处理，不调用 OpenAI API，也不需要 API Key。</p><p>点讲座页中的“中英字幕”“生成摘要”或“问 AI”后，插件会复制提示词并打开 ChatGPT。切到 ChatGPT 标签，按 Ctrl+V 粘贴，再点击发送。</p><p>浏览器会使用你当前 ChatGPT 账号可用的套餐额度；超长讲座可能需要分段处理。</p></html>
